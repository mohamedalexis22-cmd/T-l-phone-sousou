<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tekka Cup 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06030c}
  #gl,#gl canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;font-family:Anton,Impact,'Arial Narrow',sans-serif}
  #logo{position:absolute;left:3.2vw;top:4vh;width:11vw;filter:drop-shadow(0 0 1.2vw rgba(155,92,255,.9));animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-.8vh) rotate(-2deg)}}
  #cup{position:absolute;left:3.6vw;top:calc(4vh + 11.8vw);color:#cdb4ff;font-size:1.9vw;letter-spacing:.45vw;text-shadow:0 0 1vw #7b2cff}
  #title{position:absolute;right:4vw;bottom:6vh;text-align:right;color:#fff;font-size:5.6vw;line-height:.95;letter-spacing:.15vw;
    text-shadow:0 0 1.6vw rgba(123,44,255,.95),0 .4vw 0 #1a0638}
  #title .v{color:#b78cff}
  .dot{display:inline-block;animation:dot 1.5s infinite}.dot:nth-child(2){animation-delay:.25s}.dot:nth-child(3){animation-delay:.5s}
  @keyframes dot{0%,60%,100%{opacity:.15}30%{opacity:1}}
  #count{margin-top:1.4vh;font-size:2.2vw;letter-spacing:.3vw;color:#d9c6ff;display:none}
  #vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6))}
</style>
</head>
<body>
<div id="gl"></div>
<div id="vig"></div>
<div id="ui">
  <img id="logo" src="__LOGO__" alt="">
  <div id="cup">CUP 2026</div>
  <div id="title">LE STREAM<br><span class="v">COMMENCE</span><br>BIENTÔT<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span><div id="count"></div></div>
</div>
<script>
window.TEKKA = { logo: "__LOGO__", jersey: "__JERSEY__", photos: __PHOTOS__ };
// compte à rebours optionnel : ?min=10
(function(){ var m=parseFloat(new URLSearchParams(location.search).get('min')); if(!(m>0))return;
  var end=Date.now()+m*60000, el=document.getElementById('count'); el.style.display='block';
  setInterval(function(){ var s=Math.max(0,Math.round((end-Date.now())/1000));
    el.textContent = s ? 'DÉBUT DANS '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0') : 'ÇA COMMENCE !'; },250); })();
</script>
<script>__BUNDLE__</script>
</body>
</html>
