<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top 10 · Régie</title>
  <link rel="stylesheet" href="da/polices.css">
  <style>
    :root { --noir:#070708; --n2:#0f0f12; --n3:#17171c; --bord:#26252d; --gris:#8a8994; --blanc:#f4f3f7; --lila:#c4a7ff; --orange:#ffb86b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--noir); color: var(--blanc); font: 14px/1.4 Inter, system-ui, sans-serif; height: 100vh; display: grid; grid-template-columns: 380px 1fr; overflow: hidden; }
    aside { border-right: 1px solid var(--bord); display: flex; flex-direction: column; min-height: 0; background: var(--n2); }
    .haut { padding: 20px; border-bottom: 1px solid var(--bord); }
    .marque { font-family: Anton, Impact, sans-serif; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
    .marque img { height: 36px; }
    .marque b { color: var(--lila); font-weight: 400; }
    label { display: block; margin-top: 14px; font: 11px "JetBrains Mono", monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--gris); }
    select { margin-top: 6px; width: 100%; background: var(--n3); color: var(--blanc); border: 1px solid var(--bord); padding: 9px 10px; font: inherit; border-radius: 6px; }
    .onglets { display: flex; border-bottom: 1px solid var(--bord); }
    .onglets button { flex: 1; background: none; border: 0; color: var(--gris); padding: 12px; font: 600 13px Inter, sans-serif; cursor: pointer; border-bottom: 2px solid transparent; }
    .onglets button.on { color: var(--blanc); border-color: var(--lila); }
    .liste { overflow: auto; flex: 1; padding: 8px 0; }
    .etape { display: flex; gap: 10px; align-items: baseline; padding: 8px 20px; cursor: pointer; color: #cfcdd8; }
    .etape:hover { background: var(--n3); }
    .etape.on { background: rgba(196,167,255,.12); color: var(--blanc); box-shadow: inset 3px 0 var(--lila); }
    .etape .k { font: 11px "JetBrains Mono", monospace; color: var(--gris); width: 26px; flex: none; }
    .etape .tag { margin-left: auto; font: 10px "JetBrains Mono", monospace; letter-spacing: .1em; color: var(--lila); border: 1px solid rgba(196,167,255,.4); padding: 1px 5px; border-radius: 4px; flex: none; }
    .alerte { margin: 10px 16px; padding: 10px 12px; border: 1px solid rgba(255,184,107,.35); background: rgba(255,184,107,.08); border-radius: 8px; color: #ffd9ad; font-size: 13px; }
    .alerte b { color: var(--orange); }
    .alerte ul { margin: 6px 0 0 16px; }
    .ok { margin: 10px 16px; padding: 10px 12px; border: 1px solid rgba(196,167,255,.35); border-radius: 8px; color: var(--lila); font-size: 13px; }
    .j { padding: 10px 20px; border-bottom: 1px solid var(--bord); }
    .j .nm { font-weight: 700; display: flex; gap: 8px; align-items: center; }
    .j .nm small { font: 10px "JetBrains Mono", monospace; color: var(--gris); }
    .j .st { color: var(--gris); font-size: 12px; margin-top: 3px; }
    .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex: none; }
    .pt.v { background: var(--lila); }
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 22px; gap: 16px; }
    .ecran { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
    .cadre16 { position: relative; aspect-ratio: 16/9; width: 100%; max-height: 100%; max-width: calc((100vh - 140px) * 16 / 9); border: 1px solid var(--bord); border-radius: 6px; overflow: hidden;
      background: radial-gradient(ellipse at 40% 40%, #3b3546, #121116 70%); }
    .cadre16.camera::before { content: "CAMÉRA"; position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); font: 2.4vw Anton, sans-serif; letter-spacing: .3em; color: rgba(255,255,255,.08); }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
    .barre { display: flex; gap: 10px; align-items: center; }
    .barre button, .barre a { background: var(--n3); color: var(--blanc); border: 1px solid var(--bord); padding: 10px 16px; border-radius: 8px; font: 600 14px Inter, sans-serif; cursor: pointer; text-decoration: none; }
    .barre button.p { background: var(--lila); color: var(--noir); border-color: var(--lila); }
    .barre .titre { margin-left: 8px; font-weight: 600; color: #cfcdd8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .barre .aide { margin-left: auto; color: var(--gris); font-size: 12px; white-space: nowrap; }
    kbd { font: 11px "JetBrains Mono", monospace; border: 1px solid var(--bord); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <aside>
    <div class="haut">
      <div class="marque"><img id="logo" alt=""><span>Régie <b>Top 10</b></span></div>
      <label for="ep">Épisode</label>
      <select id="ep"></select>
    </div>
    <div class="onglets"><button class="on" data-o="deroule">Déroulé</button><button data-o="banque">Banque de joueurs</button></div>
    <div class="liste" id="liste"></div>
  </aside>
  <main>
    <div class="ecran"><div class="cadre16" id="cadre"><iframe id="scene" title="Aperçu de la scène"></iframe></div></div>
    <div class="barre">
      <button id="prec">← Précédent</button>
      <button id="suiv" class="p">Suivant →</button>
      <button id="rej">↻ Rejouer</button>
      <a id="ouvrir" target="_blank">Ouvrir la scène seule</a>
      <span class="titre" id="titre"></span>
      <span class="aide"><kbd>→</kbd> <kbd>←</kbd> <kbd>R</kbd> · incrustations sur fond transparent</span>
    </div>
  </main>

  <script src="da/marque.js"></script>
  <script src="data/joueurs.js"></script>
  <script src="data/joueurs-transfermarkt.js"></script>
  <script src="data/episodes/liste.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const frame = $("#scene");
    let steps = [], cur = 0, onglet = "deroule", epNom = new URLSearchParams(location.search).get("ep") || LISTE_EPISODES[0];
    const BANQUE = Object.fromEntries(JOUEURS.map((j) => [j.id, j]));
    $("#logo").src = MARQUE.logo;

    $("#ep").innerHTML = LISTE_EPISODES.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
    $("#ep").value = epNom;
    $("#ep").onchange = () => { epNom = $("#ep").value; history.replaceState(null, "", "?ep=" + encodeURIComponent(epNom)); charger(0); };

    function charger(i) {
      frame.src = `scene.html?ep=${encodeURIComponent(epNom)}&i=${i}`;
      if (!EPISODES[epNom]) { const s = document.createElement("script"); s.src = `data/episodes/${epNom}.js`; s.onload = rendreListe; document.head.appendChild(s); }
    }
    const envoyer = (m) => frame.contentWindow.postMessage(m, "*");
    $("#prec").onclick = () => envoyer({ kit: "precedent" });
    $("#suiv").onclick = () => envoyer({ kit: "suivant" });
    $("#rej").onclick = () => envoyer({ kit: "rejouer" });
    addEventListener("keydown", (e) => {
      if (e.target.tagName === "SELECT") return;
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); envoyer({ kit: "suivant" }); }
      else if (e.key === "ArrowLeft") envoyer({ kit: "precedent" });
      else if (e.key === "r" || e.key === "R") envoyer({ kit: "rejouer" });
    });
    document.querySelectorAll(".onglets button").forEach((b) => (b.onclick = () => {
      onglet = b.dataset.o; document.querySelectorAll(".onglets button").forEach((x) => x.classList.toggle("on", x === b)); rendreListe();
    }));

    addEventListener("message", (e) => {
      const m = e.data || {};
      if (m.kit === "pret") { steps = m.steps; rendreListe(); }
      if (m.kit === "etape") { cur = m.i; majEtape(); }
    });

    function majEtape() {
      document.querySelectorAll(".etape").forEach((el) => el.classList.toggle("on", Number(el.dataset.i) === cur));
      document.querySelector(".etape.on")?.scrollIntoView({ block: "nearest" });
      const s = steps[cur];
      $("#titre").textContent = s ? `${cur + 1}/${steps.length} · ${s.label}` : "";
      $("#cadre").classList.toggle("camera", !!(s && s.overlay));
      $("#ouvrir").href = `scene.html?ep=${encodeURIComponent(epNom)}#${cur}`;
    }

    function controles(ep) {
      if (!ep) return "";
      const refs = new Set();
      Object.values(ep.classements || {}).forEach((l) => l.forEach((r) => r && refs.add(r)));
      (ep.mentions || []).forEach(([r]) => r && refs.add(r));
      const libres = [], nonVerif = [], manques = [];
      refs.forEach((r) => {
        const j = BANQUE[r];
        if (!j) return libres.push(r);
        if (!j.verifie) nonVerif.push(`${j.prenom} ${j.nom}`);
        const vides = (ep.stats || []).filter((s) => {
          const ov = ep.statsEpisode && ep.statsEpisode[r];
          return (ov?.[s.cle] ?? j.stats?.[s.cle]) == null;
        }).map((s) => s.label || STATS_LABELS[s.cle] || s.cle);
        if (vides.length) manques.push(`${j.surnom || j.nom} : ${vides.join(", ")}`);
      });
      const vides = Object.values(ep.classements || {}).flat().filter((r) => !r).length;
      let h = "";
      if (vides) h += `<div class="alerte"><b>${vides} place(s) vide(s)</b> dans les classements.</div>`;
      if (libres.length) h += `<div class="alerte"><b>Hors banque</b> (pas de stats affichées) :<ul>${libres.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
      if (manques.length) h += `<div class="alerte"><b>Stats manquantes</b> (affichées « — ») :<ul>${manques.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
      if (nonVerif.length) h += `<div class="alerte"><b>${nonVerif.length} fiche(s) non vérifiée(s)</b> — à contrôler avant tournage.</div>`;
      return h || `<div class="ok">Tout est rempli et vérifié.</div>`;
    }

    function rendreListe() {
      const ep = EPISODES[epNom];
      if (onglet === "banque") {
        $("#liste").innerHTML = JOUEURS.map((j) => `<div class="j"><div class="nm"><span class="pt ${j.verifie ? "v" : ""}" title="${j.verifie ? "Vérifié" : "À vérifier"}"></span>${esc(j.prenom)} ${esc(j.nom)} <small>${esc(j.id)} · ${esc(j.nation)}</small></div>
          <div class="st">${Object.entries(j.stats || {}).map(([k, v]) => `${esc(STATS_LABELS[k] || k)} ${esc(v)}`).join(" · ") || "aucune stat"}</div></div>`).join("");
        return;
      }
      $("#liste").innerHTML = controles(ep) + steps.map((s, i) => `<div class="etape" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(s.label)}</span>${s.overlay ? `<span class="tag">INCRUST.</span>` : ""}</div>`).join("");
      document.querySelectorAll(".etape").forEach((el) => (el.onclick = () => envoyer({ kit: "aller", i: Number(el.dataset.i) })));
      majEtape();
    }
    charger(0);
  </script>
</body>
</html>
